/* ─── HOME ─── */
function Stage({ w, h, children }) {
  const ref = useRef(null);
  const [scale, setScale] = useState(typeof window!=='undefined' ? Math.min(1, window.innerWidth/w) : 1);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const upd = () => setScale(el.clientWidth / w);
    upd();
    const ro = new ResizeObserver(upd); ro.observe(el);
    return () => ro.disconnect();
  }, [w]);
  return (
    <div ref={ref} style={{ position:'relative', width:'100%', height:h*scale, overflow:'hidden' }}>
      <div style={{ position:'absolute', top:0, left:0, width:w, height:h, transform:`scale(${scale})`, transformOrigin:'top left' }}>{children}</div>
    </div>
  );
}

/* Desktop app icon. `to` is where a click navigates — assign per icon. */
function Ic({ x, y, size=96, src, label, to, setPage, dark, round=8, ext, face, flat, chat }) {
  const [h, setH] = useState(false);
  const onClick = () => { if (chat) window.dispatchEvent(new Event('open-pixelmate')); else if (ext) window.open(ext,'_blank'); else if (to) setPage(to); };
  return (
    <div onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
      style={{ position:'absolute', left:x, top:y, width:size, display:'flex', flexDirection:'column', gap:10, alignItems:'center', cursor:'pointer', transition:'transform .18s ease', transform:h?'translateY(-4px) scale(1.04)':'none' }}>
      {face ? (
        <div style={{ width:size, height:size, borderRadius:round, overflow:'hidden', boxShadow:h?'0 16px 34px rgba(0,0,0,0.4)':'0 6px 18px rgba(0,0,0,0.28)', transition:'box-shadow .18s' }}>{face}</div>
      ) : (
        <img src={src} alt={label} style={{ width:size, height:size, borderRadius:round, objectFit:'cover', display:'block', boxShadow:flat?'none':(h?'0 16px 34px rgba(0,0,0,0.4)':'0 6px 18px rgba(0,0,0,0.28)'), transition:'box-shadow .18s' }} />
      )}
      <span style={{ width:size+16, marginLeft:-8, textAlign:'center', fontFamily:"'Archivo',sans-serif", fontSize:18, fontWeight:600, lineHeight:1.15, color:dark?'#F3F3F2':'#0C0C0B', textShadow:dark?'0 1px 6px rgba(0,0,0,0.5)':'none' }}>{label}</span>
    </div>
  );
}

function BrandbookModal({ onClose }) {
  const wrapRef = useRef(null);
  const [status, setStatus] = useState('loading');
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    document.body.style.overflow = 'hidden';
    window.addEventListener('keydown', onKey);
    let cancelled = false;
    (async () => {
      try {
        if (!window.pdfjsLib) { setStatus('error'); return; }
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        const pdf = await window.pdfjsLib.getDocument('assets/moonlight-brandbook.pdf').promise;
        if (cancelled) return;
        const wrap = wrapRef.current;
        if (!wrap) return;
        wrap.innerHTML = '';
        for (let n = 1; n <= pdf.numPages; n++) {
          const page = await pdf.getPage(n);
          if (cancelled) return;
          const viewport = page.getViewport({ scale: 2 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width; canvas.height = viewport.height;
          canvas.style.cssText = 'width:100%;height:auto;display:block;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,0.4)';
          wrap.appendChild(canvas);
          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        }
        if (!cancelled) setStatus('done');
      } catch (e) { if (!cancelled) setStatus('error'); }
    })();
    return () => { cancelled = true; document.body.style.overflow = ''; window.removeEventListener('keydown', onKey); };
  }, [onClose]);
  return (
    <div onClick={onClose} style={{ position:'fixed', inset:0, zIndex:2000, background:'rgba(12,12,11,0.9)', backdropFilter:'blur(6px)', display:'flex', flexDirection:'column', alignItems:'center', padding:'28px 24px' }}>
      <div onClick={e=>e.stopPropagation()} style={{ width:'100%', maxWidth:820, display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16, flexShrink:0 }}>
        <span style={{ fontFamily:"'Jersey 25',sans-serif", fontSize:20, color:'#F3F3F2' }}>Moonlight Compass — Mini Brandbook</span>
        <div style={{ display:'flex', gap:10 }}>
          <a href="assets/moonlight-brandbook.pdf" download style={{ background:'rgba(243,243,242,0.12)', color:'#F3F3F2', border:'1px solid rgba(243,243,242,0.2)', borderRadius:8, padding:'9px 18px', fontFamily:"'Archivo',sans-serif", fontSize:13, fontWeight:700, textDecoration:'none' }}>Скачать PDF</a>
          <button onClick={onClose} style={{ background:'rgb(229,158,55)', color:'#0C0C0B', border:'none', borderRadius:8, padding:'9px 18px', fontFamily:"'Archivo',sans-serif", fontSize:13, fontWeight:700, cursor:'pointer' }}>Закрыть ✕</button>
        </div>
      </div>
      <div onClick={e=>e.stopPropagation()} style={{ width:'100%', maxWidth:820, flex:1, minHeight:0, overflowY:'auto', display:'flex', flexDirection:'column', gap:20, padding:'4px 4px 20px' }}>
        {status==='loading' && <div style={{ color:'rgba(243,243,242,0.7)', textAlign:'center', padding:'60px 0', fontFamily:"'Fustat',sans-serif" }}>Загрузка брендбука…</div>}
        {status==='error' && <div style={{ color:'rgba(243,243,242,0.7)', textAlign:'center', padding:'60px 0', fontFamily:"'Fustat',sans-serif" }}>Не удалось открыть файл. <a href="assets/moonlight-brandbook.pdf" download style={{ color:'rgb(229,158,55)' }}>Скачать PDF</a></div>}
        <div ref={wrapRef} style={{ display:'flex', flexDirection:'column', gap:20 }} />
      </div>
    </div>
  );
}

function BrandbookPreview() {
  const canvasRef = useRef(null);
  const download = async (e) => {
    e.preventDefault();
    try {
      const res = await fetch('assets/moonlight-brandbook.pdf');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'Moonlight Compass — Brandbook.pdf';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (err) {
      window.open('assets/moonlight-brandbook.pdf', '_blank');
    }
  };
  useEffect(() => {
    let cancelled = false;
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      window.pdfjsLib.getDocument('assets/moonlight-brandbook.pdf').promise.then(pdf => pdf.getPage(1)).then(page => {
        if (cancelled) return;
        const scale = 2;
        const viewport = page.getViewport({ scale });
        const canvas = canvasRef.current;
        if (!canvas) return;
        canvas.width = viewport.width; canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        page.render({ canvasContext: ctx, viewport });
      }).catch(()=>{});
    }
    return () => { cancelled = true; };
  }, []);
  return (
    <a href="assets/moonlight-brandbook.pdf" download onClick={download} style={{ display:'block', width:'100%', position:'relative', borderRadius:10, overflow:'hidden', border:'1px solid rgba(12,12,11,0.1)', cursor:'pointer', textDecoration:'none' }}>
      <div style={{ width:'100%', height:320, position:'relative', background:'#0C0C0B' }}>
        <canvas ref={canvasRef} style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }} />
        <div style={{ position:'absolute', inset:0, background:'linear-gradient(180deg,rgba(12,12,11,0) 55%,rgba(12,12,11,0.85) 100%)' }} />
        <div style={{ position:'absolute', bottom:16, left:0, right:0, textAlign:'center' }}>
          <span style={{ background:'rgb(229,158,55)', color:'#0C0C0B', fontSize:12, fontWeight:700, padding:'10px 22px', borderRadius:20, letterSpacing:'.04em' }}>Download full brandbook ↓</span>
        </div>
      </div>
    </a>
  );
}

/* ─── SHARED: SCROLL REVEAL ─── */
function Reveal({ children, delay=0, style }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setInView(true); obs.disconnect(); } }, { threshold:0.15 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return <div ref={ref} className={`reveal${inView?' in':''}`} style={{ transitionDelay:`${delay}ms`, ...style }}>{children}</div>;
}

        method:'POST', headers:{ 'Content-Type':'application/json', 'Accept':'application/json' },
        body: JSON.stringify({ name:nd.name, contact:nd.contact, problem:nd.problem, chat_transcript:chatLog, _subject:'New PixelMate chat lead — Pixel Experts' })
      });
      if (!res.ok) throw new Error('failed');
      setMsgs(m => [...m, { from:'bot', text:"You're all set! ✨ Our team will reach out to you very soon. Have a great day!" }]);
      setDone(true);
    } catch (e) {
      setMsgs(m => [...m, { from:'bot', text:'Hmm, something went wrong sending your request. You can email us directly at elena@pixelexpertsteam.com.' }]);
    } finally { setSending(false); }
  };
  const handleSend = () => {
    const t = input.trim(); if (!t || sending || done) return;
    const nm = [...msgs, { from:'user', text:t }];
    setInput('');
    if (step===0) { setData(d=>({...d,name:t})); nm.push({ from:'bot', text:script[1].replace('{name}',t) }); setStep(1); setMsgs(nm); }
    else if (step===1) { setData(d=>({...d,contact:t})); nm.push({ from:'bot', text:script[2] }); setStep(2); setMsgs(nm); }
    else if (step===2) { const nd={...data,problem:t}; setData(nd); nm.push({ from:'bot', text:'Thank you! Sending your request to our team… 🚀' }); setStep(3); setMsgs(nm); submitAll(nd, nm); }
  };
  if (!open) return null;
  return (
    <div style={{ position:'fixed', bottom:92, right:24, zIndex:1200, width:'min(370px, calc(100vw - 32px))', height:'min(560px, calc(100vh - 130px))', display:'flex', flexDirection:'column', background:'#F3F3F2', borderRadius:16, overflow:'hidden', boxShadow:'0 24px 70px rgba(0,0,0,0.4)', fontFamily:"'Archivo',sans-serif" }}>
      <div style={{ background:'#0C0C0B', padding:'16px 18px', display:'flex', alignItems:'center', gap:12 }}>
        <div style={{ position:'relative' }}>
          <img src="assets/pixelmate-avatar.png" alt="PM" style={{ width:40, height:40, borderRadius:9, objectFit:'cover', display:'block' }} />
          <span style={{ position:'absolute', top:1, right:1, width:9, height:9, borderRadius:'50%', background:'rgb(73,142,33)', border:'2px solid #0C0C0B' }} />
        </div>
        <div style={{ flex:1 }}>
          <div style={{ fontFamily:"'Jersey 25',sans-serif", fontSize:18, color:'#F3F3F2' }}>PixelMate</div>
          <div style={{ fontSize:11, color:'rgba(243,243,242,0.55)' }}>AI assistant · online</div>
        </div>
        <button onClick={()=>setOpen(false)} style={{ background:'transparent', border:'none', color:'rgba(243,243,242,0.6)', fontSize:20, cursor:'pointer', lineHeight:1 }}>✕</button>
      </div>
      <div ref={scrollRef} style={{ flex:1, overflowY:'auto', padding:'18px 16px', display:'flex', flexDirection:'column', gap:12, background:'#F3F3F2' }}>
        {msgs.map((m,i)=>(
          <div key={i} style={{ alignSelf:m.from==='bot'?'flex-start':'flex-end', maxWidth:'82%', background:m.from==='bot'?'#fff':'#0C0C0B', color:m.from==='bot'?'#0C0C0B':'#F3F3F2', borderRadius:m.from==='bot'?'4px 14px 14px 14px':'14px 4px 14px 14px', padding:'11px 14px', fontSize:14, lineHeight:1.5, boxShadow:'0 2px 10px rgba(0,0,0,0.06)' }}>{m.text}</div>
        ))}
        {sending && <div style={{ alignSelf:'flex-start', color:'rgba(12,12,11,0.4)', fontSize:13, padding:'0 4px' }}>PixelMate is typing…</div>}
      </div>
      <div style={{ display:'flex', gap:8, padding:12, borderTop:'1px solid rgba(0,0,0,0.07)', background:'#fff' }}>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') handleSend(); }}
          disabled={done} placeholder={done?'Chat ended — thank you!':'Type your message…'}
          style={{ flex:1, border:'1px solid rgba(0,0,0,0.12)', borderRadius:8, padding:'11px 14px', fontFamily:"'Archivo',sans-serif", fontSize:14, outline:'none', background:done?'rgba(0,0,0,0.03)':'#fff' }} />
        <button onClick={handleSend} disabled={done||sending} style={{ background:done?'rgba(12,12,11,0.3)':'#0C0C0B', color:'#F3F3F2', border:'none', borderRadius:8, padding:'0 18px', fontFamily:"'Archivo',sans-serif", fontSize:14, fontWeight:700, cursor:done?'default':'pointer' }}>Send</button>
      </div>
    </div>
  );
}

function App() {
  const saved = (() => { try { return localStorage.getItem('pixel_page')||'home'; } catch { return 'home'; } })();
  const [page, setPageRaw] = useState(saved);
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweakVisible, setTweakVisible] = useState(false);

  const setPage = (p) => {
    setPageRaw(p);
    try { localStorage.setItem('pixel_page', p); } catch {}
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweakVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweakVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  };

  const pages = { home: Home, work: Work, branding: Branding, about: About, contact: Contact, 'moonlight-case': MoonlightCase, 'budrysowka-case': BudrysowkaCase, 'herbaczar-case': HerbaczarCase, 'sacred-case': SacredSoundCase, 'uriel-case': UrielCase };
  const PageComponent = pages[page] || Home;

  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <Nav activePage={page} setPage={setPage} />
      <main key={page} className="page-enter" style={{ flex:1 }}>
        <PageComponent setPage={setPage} tweaks={tweaks} />
      </main>
      <Footer setPage={setPage} />
      <PixelMateChat />

      {/* PixelMate float */}
      {tweaks.showPixelMate && (
        <div onClick={()=>window.dispatchEvent(new Event('open-pixelmate'))} style={{ position:'fixed', bottom:24, right:24, zIndex:999, display:'flex', flexDirection:'column', alignItems:'center', gap:5, cursor:'pointer', filter:'drop-shadow(0 4px 18px rgba(0,0,0,0.22))' }}>
          <div style={{ position:'relative' }}>
            <div style={{ position:'absolute', inset:-3, borderRadius:12, background:'linear-gradient(135deg,rgb(73,160,169),rgb(229,158,55))', zIndex:-1, animation:'pulse 2.5s ease-in-out infinite' }} />
            <img src="assets/pixelmate-avatar.png" alt="PM" style={{ width:50, height:50, borderRadius:10, objectFit:'cover', display:'block' }} />
            <span style={{ position:'absolute', top:3, right:3, width:9, height:9, borderRadius:'50%', background:'rgb(73,142,33)', border:'2px solid #fff' }} />
          </div>
          <span style={{ fontFamily:"'Archivo',sans-serif", fontSize:9, color:'#0C0C0B', background:'rgba(255,255,255,0.92)', padding:'2px 7px', borderRadius:4, fontWeight:700, letterSpacing:'.05em' }}>PixelMate</span>
        </div>
      )}

      {/* Tweaks */}
      {tweakVisible && (
        <div style={{ position:'fixed', bottom:20, left:20, zIndex:9999, background:'rgba(12,12,11,0.96)', backdropFilter:'blur(18px)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:12, padding:18, width:260, boxShadow:'0 8px 36px rgba(0,0,0,0.38)', color:'#F3F3F2' }}>
          <div style={{ fontFamily:"'Jersey 25',sans-serif", fontSize:15, marginBottom:14, color:'rgb(229,158,55)' }}>Tweaks</div>
          <div style={{ display:'flex', flexDirection:'column', gap:13 }}>
            <div>
              <label style={{ fontFamily:"'Archivo',sans-serif", fontSize:10, color:'rgba(243,243,242,0.5)', display:'block', marginBottom:5 }}>Teal accent</label>
              <div style={{ display:'flex', gap:7 }}>
                {['#49A0A9','#31CDF8','#73968A','#163A6B'].map(c=>(
                  <div key={c} onClick={()=>updateTweak('accentColor',c)} style={{ width:26, height:26, borderRadius:5, background:c, cursor:'pointer', border:tweaks.accentColor===c?'2px solid #fff':'2px solid transparent' }} />
                ))}
              </div>
            </div>
            <div>
              <label style={{ fontFamily:"'Archivo',sans-serif", fontSize:10, color:'rgba(243,243,242,0.5)', display:'block', marginBottom:5 }}>Amber accent</label>
              <div style={{ display:'flex', gap:7 }}>
                {['#E59E37','#FED263','#FF9018','#E57E37'].map(c=>(
                  <div key={c} onClick={()=>updateTweak('ambColor',c)} style={{ width:26, height:26, borderRadius:5, background:c, cursor:'pointer', border:tweaks.ambColor===c?'2px solid #fff':'2px solid transparent' }} />
                ))}
              </div>
            </div>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <label style={{ fontFamily:"'Archivo',sans-serif", fontSize:10, color:'rgba(243,243,242,0.5)' }}>Show PixelMate</label>
              <div onClick={()=>updateTweak('showPixelMate',!tweaks.showPixelMate)} style={{ width:38, height:20, borderRadius:10, background:tweaks.showPixelMate?'rgb(73,142,33)':'rgba(255,255,255,0.12)', cursor:'pointer', position:'relative', transition:'background .2s' }}>
                <div style={{ position:'absolute', top:2, left:tweaks.showPixelMate?19:2, width:16, height:16, borderRadius:'50%', background:'#fff', transition:'left .2s' }} />
              </div>
            </div>
            <div>
              <label style={{ fontFamily:"'Archivo',sans-serif", fontSize:10, color:'rgba(243,243,242,0.5)', display:'block', marginBottom:7 }}>Quick nav</label>
              <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
                {[['home','Home'],['work','Work'],['branding','Brand'],['about','About'],['contact','Contact']].map(([id,lb])=>(
                  <button key={id} onClick={()=>setPage(id)} style={{ background:page===id?'rgb(73,160,169)':'rgba(255,255,255,0.07)', border:'none', borderRadius:5, padding:'4px 10px', fontFamily:"'Archivo',sans-serif", fontSize:10, color:'#F3F3F2', cursor:'pointer' }}>{lb}</button>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
